site_name: Kay McNulty
site_description: Documentação do projeto da equipe Kay McNulty, Qualidade de Software 2026-2 (T02), UnB/FCTE.
site_author: Equipe Kay McNulty
site_url: https://fcte-qualidade-de-software-1.github.io/2026-2_T02_KAY_MCNULTY/

repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_KAY_MCNULTY
repo_name: FCTE-Qualidade-de-Software-1/2026-2_T02_KAY_MCNULTY
edit_uri: edit/main/docs/

copyright: Versão 1.0 · Atualizado em 18/10/2026 · Equipe Kay McNulty · Qualidade de Software 2026-2

theme:
  name: material
  language: pt-BR
  favicon: img/Icon.png
  logo: img/Icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/weather-night
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/weather-sunny
        name: Ativar modo claro
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

nav:
  - Início: index.md
  - Planejamento (Fase 1):
      - Propósito e Stakeholders: fase1/proposito-stakeholders.md
      - Arquitetura e Módulos: fase1/arquitetura-modulos.md
      - Modelo de Qualidade: fase1/modelo-qualidade.md
      - Escopo e Limites da Avaliação: fase1/escopo-limites.md
      - Alinhamento aos ODS: fase1/ods.md
  - Especificação GQM (Fase 2):
      - Visão Geral do GQM: fase2/index.md
      - Compatibilidade: fase2/compatibilidade.md
      - Usabilidade: fase2/usabilidade.md
      - Confiabilidade: fase2/confiabilidade.md
  - Gestão do Projeto (PSM):
      - Atas de Reunião: gestao/atas.md
      - Métricas de Gestão PSM: gestao/metricas-psm.md
      - Tabela de Contribuição: gestao/tabela-contribuicao.md
  - Entregas:
      - Entrega 1: entregas/entrega1.md

plugins:
  - search:
      lang: pt
  - git-revision-date-localized:
      type: date
      locale: pt
      enable_creation_date: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_KAY_MCNULTY

extra_css:
  - stylesheets/extra.css