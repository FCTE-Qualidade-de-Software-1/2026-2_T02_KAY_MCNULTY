name: Métricas PSM

on:
  push:
    branches:
      - main
      - psm
    paths-ignore:
      - 'snippets/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Atualizar Snippets e Gráficos PSM
        run: python3 .github/scripts/update_metrics.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commitar Snippets Atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snippets/*
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos snippets de métricas."
          else
            git commit -m "feat(metrics): atualiza painel e snippets de métricas PSM [skip ci]"
            git push
          fi
